<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Dark background -->
  <rect width="800" height="600" fill="#0f172a"/>
  
  <!-- Floating gradient bubbles (v0/vercel aesthetic) -->
  <circle cx="200" cy="150" r="100" fill="url(#pinkGrad)" opacity="0.15"/>
  <circle cx="600" cy="400" r="150" fill="url(#blueGrad)" opacity="0.1"/>
  <circle cx="400" cy="300" r="80" fill="#8b5cf6" opacity="0.08"/>
  
  <!-- Dashboard mockup -->
  <rect x="150" y="80" width="500" height="340" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <!-- Header bar -->
  <rect x="150" y="80" width="500" height="50" rx="16" fill="#1e293b"/>
  <rect x="150" y="114" width="500" height="2" fill="#334155"/>
  
  <!-- Sidebar dots -->
  <circle cx="180" cy="105" r="6" fill="#ef4444"/>
  <circle cx="200" cy="105" r="6" fill="#eab308"/>
  <circle cx="220" cy="105" r="6" fill="#22c55e"/>
  
  <!-- Chart bars -->
  <g opacity="0.9">
    <rect x="200" y="280" width="40" height="100" rx="4" fill="url(#pinkGrad)"/>
    <rect x="260" y="240" width="40" height="140" rx="4" fill="url(#blueGrad)"/>
    <rect x="320" y="200" width="40" height="180" rx="4" fill="url(#pinkGrad)"/>
    <rect x="380" y="220" width="40" height="160" rx="4" fill="url(#blueGrad)"/>
    <rect x="440" y="180" width="40" height="200" rx="4" fill="url(#pinkGrad)"/>
    <rect x="500" y="260" width="40" height="120" rx="4" fill="url(#blueGrad)"/>
  </g>
  
  <!-- Status cards -->
  <rect x="180" y="150" width="140" height="60" rx="8" fill="#0f172a"/>
  <text x="200" y="175" font-family="system-ui" font-size="11" fill="#94a3b8">Total Users</text>
  <text x="200" y="195" font-family="system-ui" font-size="18" font-weight="bold" fill="white">12,847</text>
  
  <rect x="340" y="150" width="140" height="60" rx="8" fill="#0f172a"/>
  <text x="360" y="175" font-family="system-ui" font-size="11" fill="#94a3b8">Revenue</text>
  <text x="360" y="195" font-family="system-ui" font-size="18" font-weight="bold" fill="#22c55e">+$48.2k</text>
  
  <rect x="500" y="150" width="130" height="60" rx="8" fill="#0f172a"/>
  <text x="520" y="175" font-family="system-ui" font-size="11" fill="#94a3b8">Growth</text>
  <text x="520" y="195" font-family="system-ui" font-size="18" font-weight="bold" fill="#3b82f6">+24.5%</text>
  
  <!-- Title -->
  <text x="400" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="white">v0 Dashboard Template</text>
  <text x="400" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Typical vibecoded SaaS UI with purple gradient accents</text>
  
  <!-- Footer badge -->
  <rect x="330" y="530" width="140" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="550" text-anchor="middle" font-family="system-ui" font-size="12" fill="#94a3b8">⚡ Built with v0</text>
</svg>