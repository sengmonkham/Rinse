<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#0a0a1a"/>
  
  <!-- Floating orbs (AI aesthetic) -->
  <circle cx="150" cy="120" r="80" fill="url(#aiGrad)" opacity="0.3"/>
  <circle cx="650" cy="480" r="120" fill="url(#glowGrad)" opacity="0.2"/>
  <circle cx="400" cy="300" r="200" fill="url(#aiGrad)" opacity="0.1"/>
  
  <!-- Neural network lines -->
  <g stroke="#667eea" stroke-width="1" opacity="0.4" filter="url(#glow)">
    <line x1="100" y1="200" x2="250" y2="150"/>
    <line x1="250" y1="150" x2="400" y2="200"/>
    <line x1="400" y1="200" x2="550" y2="120"/>
    <line x1="550" y1="120" x2="700" y2="180"/>
    <line x1="100" y1="350" x2="250" y2="300"/>
    <line x1="250" y1="300" x2="400" y2="350"/>
    <line x1="400" y1="350" x2="550" y2="280"/>
    <line x1="550" y1="280" x2="700" y2="350"/>
    <line x1="250" y1="150" x2="250" y2="300"/>
    <line x1="400" y1="200" x2="400" y2="350"/>
    <line x1="550" y1="120" x2="550" y2="280"/>
  </g>
  
  <!-- Neural nodes -->
  <g fill="#a78bfa" filter="url(#glow)">
    <circle cx="100" cy="200" r="8"/>
    <circle cx="100" cy="350" r="8"/>
    <circle cx="250" cy="150" r="10"/>
    <circle cx="250" cy="300" r="10"/>
    <circle cx="400" cy="200" r="12"/>
    <circle cx="400" cy="350" r="12"/>
    <circle cx="550" cy="120" r="10"/>
    <circle cx="550" cy="280" r="10"/>
    <circle cx="700" cy="180" r="8"/>
    <circle cx="700" cy="350" r="8"/>
  </g>
  
  <!-- Center brain icon -->
  <g transform="translate(400,280)" fill="none" stroke="#a78bfa" stroke-width="2" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="45" ry="35"/>
    <path d="M-25,-10 Q-35,-25 -15,-30 Q0,-35 15,-30 Q35,-25 25,-10"/>
    <path d="M-15,10 Q0,25 15,10"/>
    <line x1="-10" y1="-5" x2="10" y2="-5"/>
  </g>
  
  <!-- Title text -->
  <text x="400" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="white">AI-Generated Art</text>
  <text x="400" y="485" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">Neural network visualization — typical AI aesthetic</text>
  
  <!-- Purple gradient bar (AI signature) -->
  <rect x="200" y="520" width="400" height="4" rx="2" fill="url(#aiGrad)" opacity="0.8"/>
</svg>