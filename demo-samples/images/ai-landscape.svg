<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="40%" style="stop-color:#16213e"/>
      <stop offset="70%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#e94560"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="80%" r="40%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#f97316;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- Sky gradient -->
  <rect width="800" height="600" fill="url(#sky)"/>
  
  <!-- Sun glow -->
  <circle cx="400" cy="480" r="200" fill="url(#sun)"/>
  <circle cx="400" cy="480" r="60" fill="#fbbf24" opacity="0.9"/>
  
  <!-- Mountains (AI-typical symmetrical composition) -->
  <polygon points="0,400 200,250 400,350 600,200 800,400" fill="#1a1a2e" opacity="0.8"/>
  <polygon points="0,450 150,300 350,380 500,280 700,350 800,450" fill="#0f172a" opacity="0.9"/>
  
  <!-- Reflection water -->
  <rect x="0" y="450" width="800" height="150" fill="#0f172a" opacity="0.6"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#fbbf24" stroke-width="0.3" opacity="0.2"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#fbbf24" stroke-width="0.3" opacity="0.15"/>
  
  <!-- Stars -->
  <g fill="white" opacity="0.6">
    <circle cx="100" cy="80" r="1.5"/>
    <circle cx="250" cy="50" r="1"/>
    <circle cx="350" cy="120" r="1.5"/>
    <circle cx="500" cy="60" r="1"/>
    <circle cx="600" cy="100" r="2"/>
    <circle cx="700" cy="40" r="1"/>
    <circle cx="150" cy="180" r="1"/>
    <circle cx="450" cy="150" r="1.5"/>
    <circle cx="650" cy="170" r="1"/>
  </g>
  
  <!-- AI watermark text -->
  <text x="400" y="560" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="white" opacity="0.8">AI-Generated Landscape</text>
  <text x="400" y="585" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Symmetrical composition — typical of DALL-E / Midjourney outputs</text>
</svg>